# 今天是什么小猪 插件配置
# 首次运行时会自动将本文件复制为 config/config.yaml，请在 config.yaml 中修改
# 管理员也可直接发送 #猪猪设置markdown开启 / #猪猪设置markdown关闭 快捷切换
# 以上配置同样可在锅巴（Guoba）「今天是什么小猪」配置页修改

# Markdown回复：开启后「今日小猪」「猪圈」将按官方QQBot支持的Markdown方式回复
# 仅官方QQBot适配器（QQ群/QQ私聊/QQ频道）生效，其他平台自动回退为普通图片回复
markdown: false

# VLM文案生成：管理面板「猪猪图鉴管理」中「AI生成文案」所用的视觉模型
# 协议为 OpenAI 兼容 chat/completions；三项全部填写后才可用
# AI 烤猪也复用这三项配置（纯文本调用），但另有独立开关
vlmApiUrl: ''
vlmApiKey: ''
vlmModel: ''

# AI 烤猪：默认关闭；开启后 AI 文案库为空/不足时尝试生成，失败回退本地文案
aiRoastEnabled: false

# 普通烤群友充能：默认满格 2 次，每 8 小时恢复 1 次
roastCooldownHours: 8
roastChargeMax: 2

# 猪圈日报：默认全局关闭；群主/管理员可在群内用「小猪日报 开启」单独打开
dailyReportDefault: false
