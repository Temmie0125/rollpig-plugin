<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: #cddffd;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
}
#container {
    width: {{penWidth}}px;
    padding: 48px 40px 56px;
    background: linear-gradient(180deg, #d9e7ff 0%, #c9dcfc 100%);
}

/* ===== 头部 ===== */
.header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px 0;
    margin-bottom: 40px;
}
.title {
    font-size: {{titleSize}}px;
    font-weight: 900;
    color: #f783b0;
    letter-spacing: 4px;
    line-height: 1;
    white-space: nowrap;
    text-shadow:
        -4px -4px 0 #fff, 4px -4px 0 #fff, -4px 4px 0 #fff, 4px 4px 0 #fff,
        0 -4px 0 #fff, 0 4px 0 #fff, -4px 0 0 #fff, 4px 0 0 #fff,
        10px 12px 0 rgba(214, 92, 146, 0.30);
}
.progress-box { text-align: right; }
.progress-text { font-size: 38px; font-weight: 800; color: #2b3a67; }
.progress-text b { font-size: 52px; color: #1f2937; }
.bar {
    margin-top: 16px;
    margin-left: auto;
    width: min(570px, 100%);
    height: 16px;
    background: #ffffff;
    border-radius: 8px;
    overflow: hidden;
}
.bar i {
    display: block;
    height: 100%;
    border-radius: 8px;
    background: linear-gradient(90deg, #f9a8c9, #f56fa7);
}
.draws { margin-top: 12px; font-size: 22px; color: #5a6b99; }

/* ===== 图鉴格子 ===== */
.grid {
    display: grid;
    grid-template-columns: repeat({{columns}}, 1fr);
    gap: 16px;
}
.card {
    position: relative;
    overflow: hidden;
    background: #ffffff;
    border-radius: 14px;
    padding: 10px 6px 12px;
    box-shadow: 0 3px 8px rgba(96, 124, 189, 0.18);
}
.imgbox {
    height: 96px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.imgbox img { max-width: 100%; max-height: 100%; }
.pname {
    margin-top: 8px;
    text-align: center;
    font-size: 17px;
    font-weight: 600;
    color: #4a5568;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.lock { color: #c3cadb; }
.card.locked .pname { color: #c3cadb; font-weight: 400; }

.ribbon {
    position: absolute;
    top: 9px;
    right: -32px;
    width: 120px;
    transform: rotate(45deg);
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    padding: 3px 0;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
}
.lv1 { background: #58c365; }
.lv2 { background: #33bfc4; }
.lv3 { background: #9d7bff; }
.lvmax { background: linear-gradient(90deg, #ff9f43, #f56fa7); }
</style>
</head>
<body>
<div id="container">
    <div class="header">
        <div class="title">猪猪图鉴</div>
        <div class="progress-box">
            <div class="progress-text">已收集 <b>{{collected}}</b> / {{total}} ｜ {{percent}}%</div>
            <div class="bar"><i style="width: {{percent}}%;"></i></div>
            <div class="draws">累计抽取 {{totalDraws}} 次 · 发送「#今日小猪」每天领一只猪猪</div>
        </div>
    </div>
    <div class="grid">
        {{each pigs}}
        {{if $value.unlocked}}
        <div class="card">
            <div class="imgbox"><img src="{{$value.image}}" /></div>
            <div class="ribbon {{($value.level > 3) ? 'lvmax' : 'lv' + $value.level}}">Lv.{{$value.level}}</div>
            <div class="pname">{{$value.name}}</div>
        </div>
        {{else}}
        <div class="card locked">
            <div class="imgbox">
                <svg class="lock" width="46" height="46" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 1 1 6 0v3H9zm3 4a1.8 1.8 0 0 1 .9 3.36V19a.9.9 0 0 1-1.8 0v-1.64A1.8 1.8 0 0 1 12 14z"/></svg>
            </div>
            <div class="pname">未解锁</div>
        </div>
        {{/if}}
        {{/each}}
    </div>
</div>
</body>
</html>
